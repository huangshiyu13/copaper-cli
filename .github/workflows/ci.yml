name: Test and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python tools/check_release.py
      - run: python -m ruff check src tests tools
      - run: python tools/check_public_tree.py
      - run: python -m pytest --cov=copaper_cli --cov-branch --cov-report=term-missing --cov-report=json --cov-report=xml
      - run: python tools/check_coverage.py
      - run: python -m build
      - run: python tools/check_public_tree.py --artifacts dist
