[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copaper-cli"
dynamic = ["version"]
description = "Work with Copaper projects, files, synchronization and compilation from the terminal."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Copaper contributors"}]
dependencies = ["pathspec>=0.12.1,<2"]

[project.scripts]
cp-cli = "copaper_cli.cli:main"

[project.urls]
Repository = "https://github.com/huangshiyu13/copaper-cli"
Issues = "https://github.com/huangshiyu13/copaper-cli/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "coverage>=7.6,<8", "build>=1.2,<2", "ruff>=0.11,<1"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "copaper_cli.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["copaper_cli"]

[tool.coverage.report]
fail_under = 95
show_missing = true
precision = 2

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
